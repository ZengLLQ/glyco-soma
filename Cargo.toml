[package]
name = "glyco-soma"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["JAYCEE <https://github.com/ZengLLQ>"]
description = "Biophysical simulation engine for multi-hormonal glucose-insulin-glucagon homeostasis, delayed subcutaneous absorption kinetics, and adaptive closed-loop artificial pancreas control."
license = "MIT"
repository = "https://github.com/ZengLLQ/glyco-soma"
keywords = [
    "artificial-pancreas",
    "endocrinology",
    "glucose-homeostasis",
    "insulin-kinetics",
    "closed-loop-control"
]
categories = ["science", "simulation", "command-line-utilities"]

[lib]
name = "glyco_soma"
path = "src/lib.rs"

[[bin]]
name = "glyco-soma"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
